[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cost-based-query-optimizer"
version = "0.2.0"
description = "A cost-based query optimizer that turns a SQL AST into an efficient physical execution plan with join reordering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]

[project.urls]
Repository = "https://github.com/juanmmm21/cost-based-query-optimizer"

[project.scripts]
cost-based-query-optimizer = "cost_based_query_optimizer.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/cost_based_query_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
